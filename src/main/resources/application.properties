# Application
spring.application.name=crime-reporting-application
server.port=${PORT:8080}

# Default to local profile (H2, no GCP credentials). Use profile "gcp" for Cloud SQL.
spring.profiles.default=local
spring.cloud.gcp.sql.enabled=false

# JPA / Hibernate (overridden per profile)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Actuator health endpoint (GET /actuator/health)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
