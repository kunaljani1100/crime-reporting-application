# Application
spring.application.name=crime-reporting-application
server.port=${PORT:8080}

# Google Cloud SQL PostgreSQL Configuration
spring.cloud.gcp.sql.database-name=${DB_NAME:crime_reports}
spring.cloud.gcp.sql.instance-connection-name=${INSTANCE_CONNECTION_NAME:project-id:region:instance-id}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
